<!DOCTYPE html>
<html>
<head>
    <title>Кабинет арендатора</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard/">
            Админ панель
        </a>

        <div class="collapse navbar-collapse">

            <!-- ЛЕВОЕ МЕНЮ -->
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}"
                       href="/dashboard/">
                        Главная
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if '/dashboard/leads/' in request.path %}active{% endif %}"
                       href="/dashboard/leads/">
                        Заявки
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if '/dashboard/settings/' in request.path %}active{% endif %}"
                       href="/dashboard/settings/">
                        Настройки
                    </a>
                </li>

            </ul>

            <!-- ПРАВАЯ ЧАСТЬ -->
            <ul class="navbar-nav ms-auto">

                <li class="nav-item d-flex align-items-center">
                    <span class="navbar-text me-3">г. {{ city_name }}</span>
                </li>

<li class="nav-item">
    <form action="{% url 'logout' %}"
          method="post"
          class="d-inline">
        {% csrf_token %}
        <button type="submit"
                class="nav-link text-danger border-0 bg-transparent">
            Выйти из панели Аминистратора
        </button>
    </form>
</li>

            </ul>

        </div>

    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
