<!DOCTYPE html>
<html>
<head>
    <title>Кабинет арендатора</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard/">Multisite</a>
        <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                            <a class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}" href="/dashboard/">
    Главная
</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if '/dashboard/leads/' in request.path %}active{% endif %}" href="/dashboard/leads/">
    Заявки
</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link {% if '/dashboard/settings/' in request.path %}active{% endif %}" href="/dashboard/settings/">
    Настройки
</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-danger" href="/logout/">Выйти</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
