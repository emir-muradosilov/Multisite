<section class="content-card p-4 p-lg-5 mb-4">


    <div class="row align-items-center g-4">

        <div class="col-lg-8">

            <h1 class="display-5 fw-bold mb-3">
                {{ page.h1_title|default:page.title }}
            </h1>

            <p class="lead text-secondary mb-4">
                Профессиональные услуги в {{ city.name }}.
                Работаем быстро, аккуратно и с гарантией результата.
            </p>

            <div class="d-flex flex-wrap gap-2">

                <a href="/{{ city.slug }}/lead/"
                   class="btn btn-primary btn-lg">
                    Рассчитать стоимость
                </a>

                {% if city.phone %}
                <a href="tel:{{ city.phone }}"
                   class="btn btn-outline-dark btn-lg">
                    Позвонить
                </a>
                {% endif %}

            </div>

        </div>

        <div class="col-lg-4">

            <div class="content-card p-4 bg-light border-0">

                <div class="mb-3">
                    <strong>Выезд:</strong><br>
                    в день обращения
                </div>

                <div class="mb-3">
                    <strong>Гарантия:</strong><br>
                    до 12 месяцев
                </div>

                <div>
                    <strong>Работаем:</strong><br>
                    {{ city.name }} и область
                </div>

            </div>

        </div>

    </div>

</section>
