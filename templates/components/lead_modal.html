<div class="modal fade" id="leadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">
                    Оставить заявку
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body lead-form-wrapper">
                <!-- Форма с классами, а не id -->
                <form class="lead-form" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="city" value="{{ city.id }}">

                    <div class="mb-3">
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Ваше имя"
                               required>
                    </div>

                    <div class="mb-3">
                        <input type="tel"
                               name="phone"
                               class="form-control phone-input"
                               placeholder="Телефон"
                               required>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input policy-check"
                               type="checkbox"
                               name="policy_accept"
                               required>
                        <label class="form-check-label small">
                            Я даю согласие на обработку персональных данных
                            и соглашаюсь с условиями
                            <a href="/privacy-policy/" target="_blank">политики конфиденциальности</a>
                            и
                            <a href="/oferta/" target="_blank">договора оферты</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3 submit-btn">
                        Отправить заявку
                    </button>
                </form>

                <!-- Блок успеха -->
                <div class="lead-success d-none text-center py-3">
                    <h5>Заявка отправлена</h5>
                    <p class="mb-0">Мы свяжемся с вами в ближайшее время.</p>
                </div>
            </div>

        </div>
    </div>
</div>
