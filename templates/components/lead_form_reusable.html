<section class="content-card p-4 p-lg-5 mb-4">
    <div class="text-center mb-4">
        <h2 class="section-title mb-3">
            <i class="bi bi-chat-right-dots me-2"></i>
            Оставить заявку
        </h2>
        <p class="text-secondary mb-0">
            Бесплатно рассчитаем стоимость работ
            и свяжемся с вами в течение 15 минут
        </p>
    </div>

    <div class="mx-auto" >
        <div class="bg-white rounded-4 p-4 p-md-5 shadow-lg border-0" style="background: linear-gradient(145deg, #ffffff 0%, #f8faff 100%);">
            <form class="lead-form" id="leadForm">
                {% csrf_token %}
                <input type="hidden" name="city" value="{{ city.id }}">

                <div class="mb-3 position-relative">
                    <i class="bi bi-person position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    <input type="text"
                           name="name"
                           class="form-control form-control-lg ps-5 rounded-3"
                           placeholder="Ваше имя"
                           required>
                </div>

                <div class="mb-3 position-relative">
                    <i class="bi bi-telephone position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary"></i>
                    <input type="tel"
                           name="phone"
                           class="form-control form-control-lg ps-5 rounded-3"
                           placeholder="Телефон"
                           id="phoneInput"
                           required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="policyAcceptInline" name="policy_accept" required>
                    <label class="form-check-label small text-secondary" for="policyAcceptInline">
                        Я даю согласие на обработку персональных данных и соглашаюсь
                        с условиями
                        <a href="/privacy-policy/" target="_blank" class="text-decoration-none">политики конфиденциальности</a>
                        и
                        <a href="/oferta/" target="_blank" class="text-decoration-none">договора оферты</a>
                    </label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm" id="submitBtn" style="background: linear-gradient(135deg, #0d6efd, #0a58ca); border: none;">
                        <span id="btnText">Отправить заявку</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="lead-success d-none text-center py-3">
                <i class="bi bi-check-circle-fill text-success fs-1 mb-2"></i>
                <h5>Заявка отправлена!</h5>
                <p class="mb-0 text-secondary">Мы свяжемся с вами в ближайшее время.</p>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script>
    $(document).ready(function () {
        // Маска для телефона
        $('#phoneInput').mask('+7 (000) 000-00-00', {placeholder: '+7 (___) ___-__-__'});

        $('#leadForm').on('submit', function (e) {
            e.preventDefault();
            var $form = $(this);
            var $submitBtn = $('#submitBtn');
            var $btnText = $('#btnText');
            var $btnSpinner = $('#btnSpinner');
            var $formContent = $form.closest('.bg-white').find('.lead-form');
            var $successDiv = $form.closest('.bg-white').find('.lead-success');

            // Простая валидация телефона
            var phone = $('#phoneInput').val();
            var phoneClean = phone.replace(/\D/g, '');
            if (phoneClean.length < 10) {
                alert('Пожалуйста, введите корректный номер телефона.');
                return;
            }

            // Блокируем кнопку и показываем спиннер
            $submitBtn.prop('disabled', true);
            $btnText.addClass('d-none');
            $btnSpinner.removeClass('d-none');

            $.ajax({
                url: '/submit-lead/',  // Замените на ваш URL обработки
                method: 'POST',
                data: $form.serialize(),
                headers: {'X-CSRFToken': '{{ csrf_token }}'},
                success: function (response) {
                    $formContent.addClass('d-none');
                    $successDiv.removeClass('d-none');
                },
                error: function (xhr) {
                    alert('Произошла ошибка. Попробуйте позже.');
                    $submitBtn.prop('disabled', false);
                    $btnText.removeClass('d-none');
                    $btnSpinner.addClass('d-none');
                }
            });
        });
    });
</script>
