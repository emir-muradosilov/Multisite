<!-- PRICE -->

{% if page.template.prices.exists %}

<section class="content-card p-4 p-lg-5 mb-4">

    <h2 class="section-title mb-4">
        Стоимость работ
    </h2>

    <div class="table-responsive">

        <table class="table table-bordered align-middle">

            <thead class="table-light">

                <tr>
                    <th>Услуга</th>
                    <th>Ед. изм.</th>
                    <th>Цена</th>
                </tr>

            </thead>

            <tbody>

                {% for item in page.template.prices.all %}

                <tr>

                    <td>{{ item.title }}</td>

                    <td>{{ item.unit }}</td>

                    <td>{{ item.price }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</section>

{% endif %}
